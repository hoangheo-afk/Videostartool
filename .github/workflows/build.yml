name: Build VideoStarTool

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build dylib
        run: |
          chmod +x build_standalone.sh
          ./build_standalone.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-dylib
          path: VideoStarTool.dylib
